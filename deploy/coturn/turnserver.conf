# coturn configuration for Najik (TURN REST API / ephemeral credentials).
# Secrets, realm, external IP and certificate paths are passed on the command line by
# docker-compose.yml (coturn does not expand environment variables in this file).

listening-port=3478
tls-listening-port=5349

# Relay port range: open these UDP ports in the firewall.
min-port=49160
max-port=49999

# Long-term credentials derived from a shared secret (TURN REST API):
#   username = "<unix expiry>:<user id>", password = base64(HMAC-SHA1(secret, username))
use-auth-secret
fingerprint
stale-nonce=600

# WebRTC only needs UDP relays; TCP/TLS are client->server transports, not relay protocols.
no-tcp-relay
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# Never relay to private, loopback, link-local or CGNAT ranges (prevents SSRF into the
# server's own network through the relay).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Abuse limits (per allocation user / server-wide). Tune for expected concurrency.
user-quota=12
total-quota=1200
max-bps=3000000

log-file=stdout
simple-log
