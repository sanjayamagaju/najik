plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.najik.calls'
version = '1.0.0'

android {
  namespace "com.najik.calls"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // NotificationCompat.CallStyle (androidx.core ≥ 1.9) and ServiceCompat.startForeground with types.
  implementation "androidx.core:core-ktx:1.13.1"
}
